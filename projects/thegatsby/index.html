<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    The Gatsby
    — LuxeVisuals
  </title>

  <meta
    name="description"
    content="A social club where you can work, play pool and Connect Four, and socialize with people around you — I designed the UI for this game."
  >

  <link
    rel="stylesheet"
    href="../../css/style.css"
  >

  <style>

    body {
      min-height: 100vh;
    }

    .project-page {
      padding-top: 40px;
    }

    .project-header {
      max-width: 760px;
      margin-bottom: 45px;
    }

    .project-header h1 {
      font-size: clamp(38px, 5vw, 62px);
      margin-top: 14px;
    }

    .project-description {
      color: var(--champagne-dim);
      font-size: 16px;
      max-width: 650px;
    }

    #project-gallery {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .portfolio-item {
      position: relative;
      display: block;
      width: 100%;
      padding: 0;
      overflow: hidden;
      background: var(--ink);
      border: 1px solid var(--line);
      cursor: pointer;
      transition:
        transform 0.35s var(--ease-out),
        border-color 0.35s var(--ease-out),
        box-shadow 0.35s var(--ease-out);
    }

    .portfolio-item:hover {
      transform: translateY(-3px);
      border-color: var(--line-bright);
      box-shadow:
        0 18px 50px -20px
        rgba(205, 164, 78, 0.35);
    }

    .portfolio-item img,
    .portfolio-item video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      transition:
        transform 0.5s var(--ease-out);
    }

    .portfolio-item:hover img,
    .portfolio-item:hover video {
      transform: scale(1.035);
    }

    @media (max-width: 640px) {

      #project-gallery {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>

  <div class="container">

    <main class="project-page">

      <a
        class="back-link"
        href="../../index.html"
      >
        ← Back to Portfolio
      </a>


      <header class="project-header">

        <span class="eyebrow">
          Selected Work
        </span>

        <h1>
          The Gatsby
        </h1>

        <p class="project-description">
          A social club where you can work, play pool and Connect Four, and socialize with people around you — I designed the UI for this game.
        </p>

      <section

    <footer class="site-footer">
